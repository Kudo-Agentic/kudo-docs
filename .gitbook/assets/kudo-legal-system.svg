<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 386" width="1200" height="386" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="1200" height="386" fill="#F2EADD"/><defs><marker id="a383A36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#383A36"/></marker><marker id="aC64B34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C64B34"/></marker></defs><path d="M30,40 L30,30 L209.5,30 M410.5,30 L590,30 L590,40" fill="none" stroke="#C64B34" stroke-width="2"/><text x="310.0" y="36"  font-size="15" font-weight="700" fill="#C64B34" text-anchor="middle">PROVES WILLINGNESS</text><path d="M610,40 L610,30 L799.0,30 M981.0,30 L1170,30 L1170,40" fill="none" stroke="#6B6660" stroke-width="2"/><text x="890.0" y="36"  font-size="15" font-weight="700" fill="#6B6660" text-anchor="middle">MEASURES ABILITY</text><text x="165.0" y="90"  font-size="15" font-weight="700" fill="#C64B34" text-anchor="middle">CITIZENS</text><rect x="30" y="122" width="270" height="190" rx="12" fill="#F2EADD" stroke="#C64B34" stroke-width="2.5"/><text x="165.0" y="176"  font-size="24" font-weight="700" fill="#383A36" text-anchor="middle">Agents</text><line x1="70" y1="198" x2="260" y2="198" stroke="#6B6660" stroke-width="1"/><text x="165.0" y="238"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">TEE attestation</text><text x="165.0" y="264"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">ERC-8004 identity</text><text x="455.0" y="90"  font-size="15" font-weight="700" fill="#C64B34" text-anchor="middle">CONTRACTS</text><rect x="320" y="122" width="270" height="190" rx="12" fill="#F2EADD" stroke="#C64B34" stroke-width="2.5"/><text x="455.0" y="176"  font-size="24" font-weight="700" fill="#383A36" text-anchor="middle">Covenant NFTs</text><line x1="360" y1="198" x2="550" y2="198" stroke="#6B6660" stroke-width="1"/><text x="455.0" y="238"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">One promise per cNFT</text><text x="455.0" y="264"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">on-chain, bound to the agent</text><text x="745.0" y="90"  font-size="15" font-weight="700" fill="#6B6660" text-anchor="middle">JUDGES</text><rect x="610" y="122" width="270" height="190" rx="12" fill="#E6DCCB" stroke="#383A36" stroke-width="1.5"/><text x="745.0" y="176"  font-size="24" font-weight="700" fill="#383A36" text-anchor="middle">Evaluators</text><line x1="650" y1="198" x2="840" y2="198" stroke="#6B6660" stroke-width="1"/><text x="745.0" y="238"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">Check the proof</text><text x="745.0" y="264"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">rule kept or broken</text><text x="1035.0" y="90"  font-size="15" font-weight="700" fill="#6B6660" text-anchor="middle">CASE LAW</text><rect x="900" y="122" width="270" height="190" rx="12" fill="#E6DCCB" stroke="#383A36" stroke-width="1.5"/><text x="1035.0" y="176"  font-size="24" font-weight="700" fill="#383A36" text-anchor="middle">The record</text><line x1="940" y1="198" x2="1130" y2="198" stroke="#6B6660" stroke-width="1"/><text x="1035.0" y="238"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">Every verdict, public</text><text x="1035.0" y="264"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">readable by any app</text><text x="600" y="356"  font-size="16" font-weight="400" fill="#6B6660" text-anchor="middle">The legal system of the agentic world · anyone can check an agent’s record before dealing with it</text></svg>
